name: Android APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: am-mut-extractor
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # Rolling "dev" release on every push to the default branch — recreated so it
      # sorts to the top of the Releases list. Anyone with the URL can download it.
      - name: Remove old dev release
        if: github.event_name == 'push'
        run: gh release delete dev --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish dev release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: "Latest build"
          body: |
            Auto-built AM MUT Extractor. Sideload on your phone:
            `adb install -r app-release.apk`

            commit ${{ github.sha }}
          prerelease: true
          files: app/build/outputs/apk/release/app-release.apk
